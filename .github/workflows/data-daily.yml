name: Refresh data

on:
  schedule:
    # 07:10 America/New_York in winter, 08:10 in summer. Runs year round;
    # the build itself decides what is worth refreshing in the offseason.
    - cron: "10 11 * * *"
  workflow_dispatch:

concurrency:
  group: data
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ./pipeline

      - name: Build
        run: python -m props build --out data/v1 --cache .cache

      - name: Validate
        run: python -m props validate data/v1

      - name: Commit if anything changed
        run: |
          git config user.name "props-bot"
          git config user.email "props-bot@users.noreply.github.com"
          git add data/v1
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Data: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash
          git push

      # The raw HTML is what you need to see when a scrape breaks, and it is
      # gone by the time you look at the site by hand.
      - name: Upload raw pages on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raw-pages
          path: .cache/raw/
          retention-days: 7

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'pipeline-failure';
            const title = 'Data refresh failed';
            const body = `The scheduled refresh failed.\n\n` +
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}\n\n` +
              `Raw pages are attached to that run as an artifact.`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label,
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: [label],
              });
            }
