name: Refresh scores

# Records and this week's results, during the windows when games are actually
# being played. Everything else is left to the daily job.
#
# GitHub's scheduled runs drift five to fifteen minutes on public runners, so
# treat this as "within about twenty minutes", not live. The app polls ESPN
# directly for a real live score.

on:
  schedule:
    - cron: "0,30 17-23 * * 0"   # Sunday afternoon and evening ET
    - cron: "0,30 0-4 * * 1"     # Sunday night spilling past midnight UTC
    - cron: "0,30 0-4 * * 2"     # Monday night
    - cron: "0,30 0-4 * * 5"     # Thursday night
  workflow_dispatch:

concurrency:
  group: data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ./pipeline

      # February through August this exits 1 and the job stops, quietly.
      - name: Skip in the offseason
        id: season
        run: python -m props season --is-in-season || echo "offseason=true" >> "$GITHUB_OUTPUT"

      - name: Refresh scores and records
        if: steps.season.outputs.offseason != 'true'
        run: |
          python -m props build --out data/v1 --only schedule,records,props --allow-partial
          python -m props validate data/v1

      - name: Commit if anything changed
        if: steps.season.outputs.offseason != 'true'
        run: |
          git config user.name "props-bot"
          git config user.email "props-bot@users.noreply.github.com"
          git add data/v1
          if git diff --cached --quiet; then
            echo "No score changes."
            exit 0
          fi
          git commit -m "Scores: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash
          git push
